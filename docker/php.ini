; Batas dinaikkan dari default PHP - import CSV performa/audience dan
; generate Laporan (PDF via dompdf, Excel via phpspreadsheet) butuh lebih
; dari default 2M/8M/30 detik. Tidak ada override eksplisit di kode
; (dicek: tidak ada ini_set()/set_time_limit() di app/), jadi batasnya
; diatur di sini, bukan ditebak per-controller.
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 120
max_input_time = 120

; Laravel butuh timezone eksplisit di beberapa environment kontainer -
; APP_TIMEZONE di .env yang jadi acuan aplikasi, ini cuma fallback PHP-nya.
date.timezone = Asia/Jakarta

expose_php = Off
